spring.application.name=cti-insights
server.port=8080

# Banco local em arquivo: funciona sem Azure e sem DBeaver.
spring.datasource.url=jdbc:h2:file:./data/cti-insights;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Segurança e integração com o frontend
api.security.token.secret=${JWT_SECRET:troque-esta-chave-em-producao-por-uma-com-32-caracteres}
api.security.token.expiration-minutes=120
api.security.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
api.etl.url=${ETL_URL:http://localhost:8000}
api.etl.key=${ETL_KEY:}
